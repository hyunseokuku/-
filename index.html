<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>툴 관리 시스템</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; text-align: center; }
        .container { max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; font-size: 16px; }
        button { border: none; color: white; font-weight: bold; cursor: pointer; }
        .btn-rent { background: #007bff; margin-top: 20px; }
        .btn-return { background: #28a745; }
        .log { margin-top: 20px; text-align: left; font-size: 13px; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🛠️ 툴 대여 시스템</h2>
        <label>사용자: 
            <select id="user">
                <option value="오현석">오현석</option>
                <option value="최금래">최금래</option>
                <option value="엄병준">엄병준</option>
            </select>
        </label>
        <label>공구: 
            <select id="tool">
                <option value="전동드릴 A">전동드릴 A</option>
                <option value="계측기 B">계측기 B</option>
                <option value="노트북 C">노트북 C</option>
            </select>
        </label>
        <button class="btn-rent" onclick="send('대여중')">출고 (대여)</button>
        <button class="btn-return" onclick="send('보관중')">입고 (반납)</button>
        <div id="result" style="margin-top:15px; font-weight:bold;"></div>
        <div id="history" class="log">최근 기록 로딩 중...</div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4s8LNCLup3HnLojYmRZFEr3BdLtv9M0puu5jETgJ8TRRc5jlIm7Yc4eBYP5ARM7dN/exec"; // <-- 여기에 붙여넣기

        async function send(status) {
            const userName = document.getElementById('user').value;
            const toolName = document.getElementById('tool').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerText = "⏳ 처리 중...";

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ userName, toolName, status })
                });
                resultDiv.innerText = "✅ 완료되었습니다!";
                loadHistory();
            } catch (e) {
                resultDiv.innerText = "❌ 오류 발생: " + e.message;
            }
        }

        async function loadHistory() {
            try {
                const res = await fetch(SCRIPT_URL);
                const data = await res.json();
                const historyDiv = document.getElementById('history');
                historyDiv.innerHTML = "<strong>[최근 기록]</strong><br>";
                data.slice(1).reverse().slice(0, 5).forEach(row => {
                    historyDiv.innerHTML += `• ${row[1]}: ${row[2]} (${row[3]})<br>`;
                });
            } catch (e) { console.log("로드 실패"); }
        }
        loadHistory();
    </script>
</body>
</html>
