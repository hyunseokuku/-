<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tool Management System</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --bg: #f8f9fa; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: var(--bg); color: #333; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; margin-bottom: 25px; color: #1a1a1a; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #666; }
        select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; appearance: none; background: #fff url("data:image/svg+xml,...") no-repeat right 12px center; }
        
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn { padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
        .btn-rent { background-color: var(--primary); }
        .btn-return { background-color: var(--success); }
        .btn:active { transform: scale(0.98); opacity: 0.9; }
        
        .status-card { margin-top: 30px; padding: 20px; background: #f1f3f5; border-radius: 15px; text-align: left; }
        .status-card h2 { font-size: 16px; margin-top: 0; border-bottom: 1px solid #dee2e6; padding-bottom: 10px; }
        .log-item { font-size: 13px; padding: 8px 0; border-bottom: 1px dashed #ced4da; display: flex; justify-content: space-between; }
        .log-item:last-child { border: none; }
        .badge { padding: 2px 6px; border-radius: 4px; font-size: 11px; color: white; }
        .bg-blue { background: var(--primary); }
        .bg-green { background: var(--success); }
        
        #loader { display: none; font-size: 14px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛠️ 툴 관리 시스템</h1>
    
    <div class="form-group">
        <label>사용자 선택</label>
        <select id="userName">
            <option value="오현석">오현석</option>
            <option value="최금래">최금래</option>
            <option value="엄병준">엄병준</option>
        </select>
    </div>

    <div class="form-group">
        <label>공구 선택</label>
        <select id="toolSelect">
            <option value="전동드릴 A">전동드릴 A</option>
            <option value="계측기 B">계측기 B</option>
            <option value="노트북 C">노트북 C</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn btn-rent" onclick="action('대여중')">대여하기</button>
        <button class="btn btn-return" onclick="action('보관중')">반납하기</button>
    </div>

    <div id="loader">데이터 전송 중...</div>

    <div class="status-card">
        <h2>최근 대여 이력 (실시간)</h2>
        <div id="log-list">로딩 중...</div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9FxrE4gmz_-T_VkHl60cMa-sFYahRz-LjkU6i2PMhkVBrbmSiWTiCESVXThwsYf8D/exec";

    async function action(status) {
        const name = document.getElementById('userName').value;
        const tool = document.getElementById('toolSelect').value;
        const loader = document.getElementById('loader');
        
        loader.style.display = 'block';

        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ userName: name, toolName: tool, status: status })
            });
            alert(`${tool} ${status} 완료!`);
            loadData();
        } catch (e) {
            alert("오류가 발생했습니다.");
        } finally {
            loader.style.display = 'none';
        }
    }

    async function loadData() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            const logList = document.getElementById('log-list');
            logList.innerHTML = '';

            // 최신 데이터 5개만 출력
            data.slice(1).reverse().slice(0, 5).forEach(row => {
                const time = new Date(row[0]).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const badgeClass = row[3] === '대여중' ? 'bg-blue' : 'bg-green';
                logList.innerHTML += `
                    <div class="log-item">
                        <span><strong>${row[1]}</strong> - ${row[2]}</span>
                        <span><span class="badge ${badgeClass}">${row[3]}</span> <small>${time}</small></span>
                    </div>`;
            });
        } catch (e) {
            document.getElementById('log-list').innerText = "데이터를 불러올 수 없습니다.";
        }
    }

    loadData(); // 초기 실행
    setInterval(loadData, 30000); // 30초마다 자동 새로고침
</script>

</body>
</html>
